<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sophia — Felsefe Ajanı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #16213e;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .avatar {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .header-info h1 { font-size: 16px; font-weight: 600; color: #f0f0f0; }
    .header-info p  { font-size: 12px; color: #8b5cf6; }

    .reset-btn {
      background: none;
      border: 1px solid #0f3460;
      color: #8b9ab3;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .reset-btn:hover { border-color: #8b5cf6; color: #8b5cf6; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; gap: 10px; max-width: 88%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.sophia { align-self: flex-start; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .sophia .msg-avatar { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
    .user   .msg-avatar { background: #0f3460; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .sophia .bubble {
      background: #16213e;
      border-bottom-left-radius: 4px;
      color: #e0e0e0;
    }
    .user .bubble {
      background: #8b5cf6;
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .typing {
      display: flex; gap: 5px; padding: 14px 16px;
      background: #16213e; border-radius: 16px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .dot {
      width: 8px; height: 8px;
      background: #8b5cf6; border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .input-area {
      padding: 12px 16px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: #e0e0e0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
    }
    textarea::placeholder { color: #5a6a7a; }
    textarea:focus { border-color: #8b5cf6; }

    #send-btn {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn svg { width: 20px; height: 20px; fill: white; }

    .welcome {
      text-align: center;
      color: #4a5568;
      margin: auto;
      padding: 20px;
    }
    .welcome h2 { color: #8b5cf6; font-size: 22px; margin-bottom: 8px; }
    .welcome p  { font-size: 14px; line-height: 1.7; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="avatar">🦉</div>
    <div class="header-info">
      <h1>Sophia</h1>
      <p>Felsefe Ajanı</p>
    </div>
  </div>
  <button class="reset-btn" onclick="resetChat()">Yeni Sohbet</button>
</header>

<div id="messages">
  <div class="welcome">
    <h2>Merhaba, ben Sophia.</h2>
    <p>Varoluş, bilgi, etik, bilinç...<br>Sormak istediğin her şeyi sor.</p>
  </div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="Sophia'ya bir şey sor..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
  </button>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("input");
  const sendBtn    = document.getElementById("send-btn");
  let   isLoading  = false;

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, text) {
    // Remove welcome screen on first message
    const welcome = messagesEl.querySelector(".welcome");
    if (welcome) welcome.remove();

    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="msg-avatar">${role === "sophia" ? "🦉" : "👤"}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    messagesEl.appendChild(div);
    scrollDown();
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg sophia";
    div.id = "typing";
    div.innerHTML = `
      <div class="msg-avatar">🦉</div>
      <div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    `;
    messagesEl.appendChild(div);
    scrollDown();
  }

  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  }

  async function sendMessage() {
    if (isLoading) return;
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    isLoading = true;
    sendBtn.disabled = true;

    addMessage("user", text);
    showTyping();

    try {
      const res  = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTyping();
      addMessage("sophia", data.reply || "Bir hata oluştu.");
    } catch (err) {
      removeTyping();
      addMessage("sophia", "Bağlantı hatası. Tekrar dene.");
    }

    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  async function resetChat() {
    await fetch("/reset", { method: "POST" });
    messagesEl.innerHTML = `
      <div class="welcome">
        <h2>Merhaba, ben Sophia.</h2>
        <p>Varoluş, bilgi, etik, bilinç...<br>Sormak istediğin her şeyi sor.</p>
      </div>`;
  }
</script>
</body>
</html>
